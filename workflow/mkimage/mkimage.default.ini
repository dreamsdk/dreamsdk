[Utilities]
; Each program below may be set either as an absolute path (e.g.
; "C:\Program Files\7-Zip\7z.exe") or as a command available in the PATH (e.g. 7z).

; Git
GIT=git

; Python 3
PYTHON=python

; 7-Zip
SEVENZIP=7z

; UPX
UPX32="%DREAMSDK_HOME%\mingw64\bin\upx.exe"

[Repositories]
; Source for "dcload-serial"
DREAMCAST_TOOL_SERIAL_URL=https://github.com/kallistios/dcload-serial.git

; Source for "dcload-ip"
DREAMCAST_TOOL_INTERNET_PROTOCOL_URL=https://github.com/kallistios/dcload-ip.git

[Generation]
; Each package below may be enabled (1) or disabled (0). At least one package
; must be enabled. By default, only the ISO image and the ZIP package are
; generated.

; Generate the ISO image
GENERATE_ISO_IMAGE=1

; Generate the ZIP package
GENERATE_ZIP_PACKAGE=1

; Generate the "dcload-serial" image
GENERATE_DREAMCAST_TOOL_SERIAL_IMAGE=0

; Generate the "dcload-ip" image
GENERATE_DREAMCAST_TOOL_INTERNET_PROTOCOL_IMAGE=0

;
; You don't need to modify anything below this line
;

[Directories]
DOCUMENTATION_INPUT_DIR=..\..\modules\doc
SETUP_INPUT_DIR=..\..\setup\builder
SYSTEM_OBJECTS_INPUT_DIR=..\..\modules\objects
